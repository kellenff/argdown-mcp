[package]
name = "argdown-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
argdown-core = { workspace = true }
argdown-parser = { workspace = true }
argdown-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "io-std"] }
schemars = { version = "1.2.1", default-features = false, features = ["derive"] }
