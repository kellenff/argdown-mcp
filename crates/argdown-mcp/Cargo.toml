[package]
name = "argdown-mcp"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
argdown-tools = { workspace = true, features = ["schemars"] }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "1.7.0", features = ["server", "client", "macros", "transport-io", "schemars"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "io-std", "io-util"] }
schemars = { version = "1.2.1", default-features = false, features = ["derive"] }
