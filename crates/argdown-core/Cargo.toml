[package]
name = "argdown-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, optional = true }

[features]
# Opt-in `serde::Serialize` on the AST types. Kept off by default so the parser
# and fuzz targets don't compile serde; `argdown-model` enables it for export.
serde = ["dep:serde"]
