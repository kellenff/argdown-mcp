[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
winnow = "1"
# default-features off drops criterion's plotters + rayon (we want neither: no
# SVG reports, no parallel-bench runtime) so the CI `--all-targets` compile stays
# lean; cargo_bench_support is the feature that keeps `cargo bench` working.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
argdown-core = { path = "crates/argdown-core" }
argdown-parser = { path = "crates/argdown-parser" }
argdown-model = { path = "crates/argdown-model" }
argdown-tools = { path = "crates/argdown-tools" }
noyalib = { version = "0.0.7", features = ["compat-serde-yaml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
